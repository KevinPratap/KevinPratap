name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: KevinPratap
          outputs: github-snake.svg?palette=github-dark

      - name: Push to output branch
        run: |
          REPO="https://github.com/${{ github.repository }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git reset --hard
          mv /github/workspace/github-snake.svg ./ 2>/dev/null || true
          git add github-snake.svg
          git commit -m "chore: update snake"
          git push "${REPO}" output --force
