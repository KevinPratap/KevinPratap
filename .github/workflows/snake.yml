name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: KevinPratap
          outputs: |
            snake.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/snake-out
          cp snake.svg /tmp/snake-out/
          cd /tmp/snake-out
          git init
          git checkout -b output
          git add snake.svg
          git commit -m "chore: update snake"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/KevinPratap/KevinPratap.git
          git push -f origin output
