name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: KevinPratap
          outputs: github-snake.svg?palette=github-dark

      - name: Push to output branch
        run: |
          cp github-snake.svg /tmp/
          git checkout --orphan output
          git reset --hard
          cp /tmp/github-snake.svg .
          git add github-snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update snake"
          gh repo set-default ${{ github.repository }}
          gh api repos/${{ github.repository }}/git/refs -X POST -f ref=refs/heads/output -f sha=$(git rev-parse HEAD) 2>/dev/null || true
          git push origin output --force
