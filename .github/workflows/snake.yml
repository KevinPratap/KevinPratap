name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: KevinPratap
          outputs: snake.svg?palette=github-dark

      - name: Push snake to output branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git reset --hard
          mv snake.svg /tmp/snake.svg 2>/dev/null || true
          rm -rf *
          mv /tmp/snake.svg snake.svg 2>/dev/null || true
          git add snake.svg
          git commit -m "chore: update snake"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/KevinPratap/KevinPratap.git
          git push origin output --force
