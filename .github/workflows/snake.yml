name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: KevinPratap
          outputs: github-snake.svg?palette=github-dark

      - name: Deploy to output branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deploy
          cp "${{ github.workspace }}/github-snake.svg" /tmp/deploy/
          cd /tmp/deploy
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-snake.svg
          git commit -m "chore: update snake"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"
          git push origin output --force
