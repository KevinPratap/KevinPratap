name: Daily Commit

# Feeds the GitHub contribution graph.
#   MIN_DAILY / MAX_DAILY = the day's contribution total is picked at random
#                           from that range (deterministic per UTC date, so
#                           every run of the day agrees on the same number)
#   RUN_MIN / RUN_MAX     = each of the four spread runs makes a random number
#                           of commits in that range
# Five runs a day, 6h apart, on odd minutes: scheduled workflow runs are often
# delayed by hours, so spacing them wider than the usual delay keeps them from
# collapsing into one day-part. The last run tops the day up to that day's
# random target, so a dropped or very late run cannot leave a pale day behind.
# Edit the four numbers below; nothing else needs to change.

on:
  schedule:
    - cron: "23 1 * * *"
    - cron: "23 7 * * *"
    - cron: "23 13 * * *"
    - cron: "23 19 * * *"
    - cron: "41 23 * * *"
  workflow_dispatch:
    inputs:
      commits:
        description: "Commits to make in this run (blank = random RUN_MIN..RUN_MAX)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-commit
  cancel-in-progress: false

env:
  MIN_DAILY: "15"
  MAX_DAILY: "25"
  RUN_MIN: "2"
  RUN_MAX: "5"
  TOPUP_CRON: "41 23 * * *"

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up git
        run: |
          git config user.name "kevinpratap"
          git config user.email "pratapkevin8@gmail.com"
          git config pull.rebase true

      - name: Decide how many commits this run makes
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_COMMITS: ${{ github.event.inputs.commits }}
        run: |
          set -euo pipefail
          day=$(date -u '+%Y-%m-%d')
          hour=$(date -u '+%H')
          # stable pseudo-random numbers per day / per run, so a retried run
          # makes the same decisions and the daily total stays consistent
          seed() { printf '%s' "$1" | cksum | cut -d' ' -f1; }
          target=$(( MIN_DAILY + $(seed "kp-$day") % (MAX_DAILY - MIN_DAILY + 1) ))
          n="${INPUT_COMMITS:-}"
          case "$n" in ''|*[!0-9]*) n="" ;; esac
          if [ -z "$n" ]; then
            n=$(( RUN_MIN + $(seed "kp-$day-$hour") % (RUN_MAX - RUN_MIN + 1) ))
          fi
          if [ "${{ github.event.schedule }}" = "$TOPUP_CRON" ] || [ "$hour" = "23" ]; then
            today=$(gh api graphql -f query='query{user(login:"KevinPratap"){contributionsCollection{contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}' \
              --jq "[.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[] | select(.date == \"$day\") | .contributionCount] | add // 0" 2>/dev/null || echo 0)
            case "$today" in ''|*[!0-9]*) today=0 ;; esac
            need=$(( target - 10#$today ))
            echo "$day already has $today contributions, today's target is $target"
            if [ "$need" -gt "$n" ]; then n="$need"; fi
          fi
          if [ "$n" -gt 40 ]; then n=40; fi
          if [ "$n" -lt 1 ]; then n=0; fi
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "run makes $n commit(s), $day target is $target"

      - name: Make the commits
        if: steps.plan.outputs.n != '0'
        run: |
          set -euo pipefail
          n="${{ steps.plan.outputs.n }}"
          day="${{ steps.plan.outputs.day }}"
          for i in $(seq 1 "$n"); do
            ts=$(date -u -d "-$(( i * 6 )) minutes" '+%Y-%m-%dT%H:%M:%SZ')
            printf '%s  %s  %02d/%02d\n' "$ts" "keep the grid green" "$i" "$n" >> .daily
            git add .daily
            GIT_AUTHOR_DATE="$ts" GIT_COMMITTER_DATE="$ts" \
              git commit -m "chore: daily sync $day ($i/$n)"
          done
          echo "made $n commit(s) dated within $day"

      - name: Push
        if: steps.plan.outputs.n != '0'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep 15
          done
          echo "push failed after 5 attempts" >&2
          exit 1
