.row{transform-box:fill-box;transform-origin:left;transform:scaleX(1);animation:row 6s cubic-bezier(.16,1,.3,1) infinite backwards}
@keyframes row{0%,8%{transform:scaleX(0)}30%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.plane{animation:plane 6s linear infinite}
