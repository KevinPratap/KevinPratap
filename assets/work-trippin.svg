.go{animation:go 1.8s cubic-bezier(.16,1,.3,1) infinite}
@keyframes go{50%{transform:translateX(9px)}}

.trail{stroke-dasharray:1;stroke-dashoffset:1;animation:trail 6s linear infinite}
