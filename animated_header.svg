<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  
  <!-- Scan line effect -->
  <line x1="0" y1="60" x2="800" y2="60" stroke="url(#line)" stroke-width="1" />
  
  <!-- Name -->
  <text x="400" y="50" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="700" fill="#e5e5e5" letter-spacing="-1">
    Kevin Pratap Sidhu
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze" />
  </text>
  
  <!-- Role -->
  <text x="400" y="85" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#888" letter-spacing="3" text-transform="uppercase">
    GENAI ENGINEER · MULTI-AGENT SYSTEMS · AUTOMATION
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze" />
  </text>
  
  <!-- Typewriter tagline -->
  <text x="400" y="125" text-anchor="middle" font-family="monospace" font-size="13" fill="#666">
    <tspan>
      <animate attributeName="opacity" values="0;1" dur="2.5s" fill="freeze" />
      $ cat /dev/null &amp;&amp; build.sh — shipping production agent systems
    </tspan>
  </text>
  
  <!-- Animated cursor -->
  <rect x="610" y="114" width="10" height="14" fill="#fff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
  
  <!-- Bottom divider line -->
  <line x1="200" y1="160" x2="600" y2="160" stroke="#333" stroke-width="1" />
  <circle cx="400" cy="160" r="3" fill="#fff">
    <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
